<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS - Rock Paper Scissors on Nostr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { opacity: 0.6; margin-bottom: 2rem; }

    .container {
      background: #16213e;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
    }

    .section {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }

    .section:last-child { border-bottom: none; margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: none;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    input {
      background: #0f3460;
      color: #eee;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .moves {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .move-btn {
      width: 80px;
      height: 80px;
      font-size: 2.5rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f3460;
      transition: all 0.2s;
    }

    .move-btn:hover { background: #1a4a7a; transform: scale(1.1); }
    .move-btn.selected { background: #667eea; transform: scale(1.1); }
    .move-btn:disabled { opacity: 0.3; transform: none; }

    .status {
      text-align: center;
      padding: 1rem;
      border-radius: 0.5rem;
      background: #0f3460;
    }

    .status.waiting { background: #1a4a7a; }
    .status.win { background: #2d6a4f; }
    .status.lose { background: #9d0208; }
    .status.draw { background: #7b5e00; }

    .game-id {
      font-family: monospace;
      font-size: 0.875rem;
      word-break: break-all;
      background: #0f3460;
      padding: 0.5rem;
      border-radius: 0.25rem;
    }

    .log {
      font-family: monospace;
      font-size: 0.75rem;
      background: #0a0a12;
      padding: 1rem;
      border-radius: 0.5rem;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .opponent-move {
      font-size: 4rem;
      text-align: center;
      margin: 1rem 0;
    }

    .vs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
    }

    .vs-move {
      font-size: 3rem;
      padding: 1rem;
      background: #0f3460;
      border-radius: 1rem;
    }

    .vs-text { font-size: 1.5rem; opacity: 0.5; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>RPS</h1>
  <p class="subtitle">Rock Paper Scissors on Nostr</p>

  <div class="container">
    <!-- Setup Section -->
    <div class="section" id="setup-section">
      <label>Your Pubkey</label>
      <div class="game-id" id="my-pubkey">Generating...</div>

      <div style="margin-top: 1rem;">
        <label>Relay</label>
        <input type="text" id="relay-input" value="wss://relay.damus.io">
      </div>
    </div>

    <!-- Create/Join Section -->
    <div class="section" id="lobby-section">
      <button id="create-btn">Create New Game</button>
      <div style="text-align: center; margin: 0.5rem 0; opacity: 0.5;">or</div>
      <label>Join Game ID</label>
      <input type="text" id="join-input" placeholder="rps:abc123...">
      <button id="join-btn">Join Game</button>
    </div>

    <!-- Waiting for Opponent -->
    <div class="section hidden" id="waiting-section">
      <label>Game ID (share with opponent)</label>
      <div class="game-id" id="game-id-display"></div>
      <div class="status waiting" style="margin-top: 1rem;">
        Waiting for opponent to join...
      </div>
    </div>

    <!-- Move Selection -->
    <div class="section hidden" id="move-section">
      <label>Choose Your Move</label>
      <div class="moves">
        <button class="move-btn" data-move="rock">🪨</button>
        <button class="move-btn" data-move="paper">📄</button>
        <button class="move-btn" data-move="scissors">✂️</button>
      </div>
      <button id="commit-btn" disabled style="margin-top: 1rem;">Commit Move</button>
    </div>

    <!-- Waiting for Commits -->
    <div class="section hidden" id="commit-section">
      <div class="status waiting">
        <div>Your move: <strong id="your-move-display"></strong></div>
        <div style="margin-top: 0.5rem; opacity: 0.7;">Waiting for opponent to commit...</div>
      </div>
    </div>

    <!-- Reveal Phase -->
    <div class="section hidden" id="reveal-section">
      <div class="status">Both committed! Revealing...</div>
    </div>

    <!-- Result -->
    <div class="section hidden" id="result-section">
      <div class="vs">
        <div class="vs-move" id="your-final-move"></div>
        <div class="vs-text">vs</div>
        <div class="vs-move" id="opponent-final-move"></div>
      </div>
      <div class="status" id="result-status"></div>
      <button id="rematch-btn" style="margin-top: 1rem;">Play Again</button>
    </div>

    <!-- Log -->
    <div class="section">
      <label>Event Log</label>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script type="module">
    import { generateSecretKey, getPublicKey, finalizeEvent, Relay } from 'https://esm.sh/nostr-tools@2.19.3';

    // Game state
    let secretKey;
    let pubkey;
    let relay;
    let gameId;
    let opponent;
    let myMove;
    let mySalt;
    let myCommit;
    let opponentCommit;
    let opponentMove;
    let isCreator = false;

    const MOVES = { rock: '🪨', paper: '📄', scissors: '✂️' };
    const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

    // Elements
    const $ = id => document.getElementById(id);
    const log = msg => {
      const el = $('log');
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${msg}\n` + el.textContent;
    };

    // Crypto helpers
    const sha256 = async (str) => {
      const buf = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const randomSalt = () => {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // Initialize
    async function init() {
      // Generate keypair
      secretKey = generateSecretKey();
      pubkey = getPublicKey(secretKey);
      $('my-pubkey').textContent = pubkey.slice(0, 8) + '...' + pubkey.slice(-4);
      log('Generated keypair');

      // Setup move buttons
      document.querySelectorAll('.move-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          myMove = btn.dataset.move;
          $('commit-btn').disabled = false;
        });
      });
    }

    // Connect to relay
    async function connectRelay() {
      const url = $('relay-input').value;
      try {
        relay = await Relay.connect(url);
        log(`Connected to ${url}`);
        return true;
      } catch (e) {
        log(`Failed to connect: ${e.message}`);
        return false;
      }
    }

    // Publish event
    async function publish(event) {
      const signed = finalizeEvent(event, secretKey);
      await relay.publish(signed);
      return signed;
    }

    // Subscribe to game events
    function subscribe(gameId) {
      relay.subscribe([
        { kinds: [30334], '#d': [gameId] },  // Game state
        { kinds: [30335], '#g': [gameId] }   // Moves
      ], {
        onevent(event) {
          handleEvent(event);
        }
      });
    }

    // Handle incoming events
    async function handleEvent(event) {
      try {
        const data = JSON.parse(event.content);

        if (event.kind === 30334) {
          // Game state update
          if (data.type === 'join' && event.pubkey !== pubkey) {
            opponent = event.pubkey;
            log(`Opponent joined: ${opponent.slice(0, 8)}...`);
            showSection('move-section');
          }
        }

        if (event.kind === 30335) {
          if (data.type === 'commit' && event.pubkey !== pubkey) {
            opponentCommit = data.hash;
            log(`Opponent committed: ${opponentCommit.slice(0, 8)}...`);
            checkBothCommitted();
          }

          if (data.type === 'reveal' && event.pubkey !== pubkey) {
            opponentMove = data.move;
            const expectedHash = await sha256(data.move + ':' + data.salt);
            if (expectedHash === opponentCommit) {
              log(`Opponent revealed: ${data.move}`);
              checkBothRevealed();
            } else {
              log('Opponent reveal hash mismatch! Cheating detected.');
            }
          }
        }
      } catch (e) {
        // Ignore parse errors
      }
    }

    // UI helpers
    function showSection(id) {
      ['lobby-section', 'waiting-section', 'move-section', 'commit-section', 'reveal-section', 'result-section']
        .forEach(s => $(s).classList.add('hidden'));
      $(id).classList.remove('hidden');
    }

    // Create game
    $('create-btn').addEventListener('click', async () => {
      if (!await connectRelay()) return;

      gameId = 'rps:' + randomSalt().slice(0, 12);
      isCreator = true;

      await publish({
        kind: 30334,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['d', gameId], ['t', 'rps']],
        content: JSON.stringify({ type: 'create', creator: pubkey })
      });

      subscribe(gameId);
      $('game-id-display').textContent = gameId;
      showSection('waiting-section');
      log(`Created game: ${gameId}`);
    });

    // Join game
    $('join-btn').addEventListener('click', async () => {
      gameId = $('join-input').value.trim();
      if (!gameId) return;

      if (!await connectRelay()) return;

      subscribe(gameId);

      // Wait a moment for subscription, then announce join
      setTimeout(async () => {
        await publish({
          kind: 30334,
          created_at: Math.floor(Date.now() / 1000),
          tags: [['d', gameId], ['t', 'rps']],
          content: JSON.stringify({ type: 'join', player: pubkey })
        });

        log(`Joined game: ${gameId}`);
        showSection('move-section');
      }, 500);
    });

    // Commit move
    $('commit-btn').addEventListener('click', async () => {
      if (!myMove) return;

      mySalt = randomSalt();
      myCommit = await sha256(myMove + ':' + mySalt);

      await publish({
        kind: 30335,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['g', gameId], ['t', 'rps-move']],
        content: JSON.stringify({ type: 'commit', hash: myCommit })
      });

      $('your-move-display').textContent = MOVES[myMove];
      showSection('commit-section');
      log(`Committed: ${myCommit.slice(0, 8)}...`);

      checkBothCommitted();
    });

    // Check if both players committed
    async function checkBothCommitted() {
      if (myCommit && opponentCommit) {
        showSection('reveal-section');
        log('Both committed! Revealing...');

        // Small delay then reveal
        setTimeout(async () => {
          await publish({
            kind: 30335,
            created_at: Math.floor(Date.now() / 1000),
            tags: [['g', gameId], ['t', 'rps-move']],
            content: JSON.stringify({ type: 'reveal', move: myMove, salt: mySalt })
          });
          log(`Revealed: ${myMove}`);
        }, 1000);
      }
    }

    // Check if both players revealed
    function checkBothRevealed() {
      if (myMove && opponentMove) {
        showResult();
      }
    }

    // Show result
    function showResult() {
      $('your-final-move').textContent = MOVES[myMove];
      $('opponent-final-move').textContent = MOVES[opponentMove];

      let result, statusClass;
      if (myMove === opponentMove) {
        result = "It's a draw!";
        statusClass = 'draw';
      } else if (BEATS[myMove] === opponentMove) {
        result = 'You win!';
        statusClass = 'win';
      } else {
        result = 'You lose!';
        statusClass = 'lose';
      }

      const statusEl = $('result-status');
      statusEl.textContent = result;
      statusEl.className = 'status ' + statusClass;

      showSection('result-section');
      log(`Result: ${myMove} vs ${opponentMove} - ${result}`);
    }

    // Rematch
    $('rematch-btn').addEventListener('click', () => {
      myMove = null;
      mySalt = null;
      myCommit = null;
      opponentCommit = null;
      opponentMove = null;
      document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
      $('commit-btn').disabled = true;
      showSection('move-section');
      log('Starting rematch...');
    });

    // Start
    init();
  </script>
</body>
</html>
