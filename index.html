<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS - Rock Paper Scissors on Nostr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { opacity: 0.6; margin-bottom: 2rem; }

    .container {
      background: #16213e;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
    }

    .section {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }

    .section:last-child { border-bottom: none; margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: none;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    input {
      background: #0f3460;
      color: #eee;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .moves {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .move-btn {
      width: 80px;
      height: 80px;
      font-size: 2.5rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f3460;
      transition: all 0.2s;
    }

    .move-btn:hover { background: #1a4a7a; transform: scale(1.1); }
    .move-btn.selected { background: #667eea; transform: scale(1.1); }
    .move-btn:disabled { opacity: 0.3; transform: none; }

    .status {
      text-align: center;
      padding: 1rem;
      border-radius: 0.5rem;
      background: #0f3460;
    }

    .status.waiting { background: #1a4a7a; }
    .status.win { background: #2d6a4f; }
    .status.lose { background: #9d0208; }
    .status.draw { background: #7b5e00; }

    .game-id {
      font-family: monospace;
      font-size: 0.875rem;
      word-break: break-all;
      background: #0f3460;
      padding: 0.5rem;
      border-radius: 0.25rem;
    }

    .log {
      font-family: monospace;
      font-size: 0.75rem;
      background: #0a0a12;
      padding: 1rem;
      border-radius: 0.5rem;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .opponent-move {
      font-size: 4rem;
      text-align: center;
      margin: 1rem 0;
    }

    .vs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
    }

    .vs-move {
      font-size: 3rem;
      padding: 1rem;
      background: #0f3460;
      border-radius: 1rem;
    }

    .vs-text { font-size: 1.5rem; opacity: 0.5; }

    .hidden { display: none; }

    .agent-card {
      background: #0f3460;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .agent-card .name {
      font-weight: 600;
      color: #667eea;
    }

    .agent-stats {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      font-size: 0.875rem;
      opacity: 0.8;
    }

    .agent-stats span {
      background: #1a1a2e;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }

    .escrow-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .escrow-toggle input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>RPS</h1>
  <p class="subtitle">Rock Paper Scissors on Nostr</p>

  <div class="container">
    <!-- Setup Section -->
    <div class="section" id="setup-section">
      <label>Your Nostr Pubkey</label>
      <div class="game-id" id="my-pubkey">Generating...</div>

      <div style="margin-top: 1rem;">
        <label>Your BTC Address (Taproot/testnet4)</label>
        <div class="game-id" id="my-btc-address">Generating...</div>
      </div>

      <div style="margin-top: 1rem;">
        <label>Balance</label>
        <div class="game-id" id="my-balance">Loading...</div>
      </div>

      <div style="margin-top: 1rem;">
        <button id="faucet-btn" disabled>Get 50k sats from Faucet</button>
        <div id="faucet-status" style="font-size: 0.875rem; margin-top: 0.5rem; opacity: 0.7;"></div>
      </div>

      <div style="margin-top: 1rem;">
        <label>Relay</label>
        <input type="text" id="relay-input" value="wss://nos.lol">
      </div>
    </div>

    <!-- Escrow Agent Section -->
    <div class="section" id="escrow-section">
      <label>Escrow Agent (Optional)</label>
      <div class="escrow-toggle">
        <input type="checkbox" id="use-escrow">
        <span>Use escrow for this game</span>
      </div>
      <div id="agent-list">
        <div class="agent-card hidden" id="agent-info">
          <div class="name" id="agent-name">Loading...</div>
          <div class="agent-stats">
            <span id="agent-games">0 games</span>
            <span id="agent-volume">0 sats</span>
          </div>
          <div style="margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.6;" id="agent-pubkey"></div>
        </div>
        <div id="no-agents" style="opacity: 0.6; font-size: 0.875rem;">
          Connect to relay to find agents...
        </div>
      </div>
    </div>

    <!-- Create/Join Section -->
    <div class="section" id="lobby-section">
      <button id="create-btn">Create New Game</button>
      <div style="text-align: center; margin: 0.5rem 0; opacity: 0.5;">or</div>
      <label>Join Game ID</label>
      <input type="text" id="join-input" placeholder="rps:abc123...">
      <button id="join-btn">Join Game</button>
    </div>

    <!-- Waiting for Opponent -->
    <div class="section hidden" id="waiting-section">
      <label>Share this link with opponent</label>
      <div class="game-id" id="game-link-display" style="cursor: pointer;"></div>
      <button id="copy-btn" style="margin-top: 0.5rem;">Copy Link</button>
      <div class="status waiting" style="margin-top: 1rem;">
        Waiting for opponent to join...
      </div>
    </div>

    <!-- Move Selection -->
    <div class="section hidden" id="move-section">
      <label>Choose Your Move</label>
      <div class="moves">
        <button class="move-btn" data-move="rock">🪨</button>
        <button class="move-btn" data-move="paper">📄</button>
        <button class="move-btn" data-move="scissors">✂️</button>
      </div>
      <button id="commit-btn" disabled style="margin-top: 1rem;">Commit Move</button>
    </div>

    <!-- Waiting for Commits -->
    <div class="section hidden" id="commit-section">
      <div class="status waiting">
        <div>Your move: <strong id="your-move-display"></strong></div>
        <div style="margin-top: 0.5rem; opacity: 0.7;">Waiting for opponent to commit...</div>
      </div>
    </div>

    <!-- Reveal Phase -->
    <div class="section hidden" id="reveal-section">
      <div class="status">Both committed! Revealing...</div>
    </div>

    <!-- Result -->
    <div class="section hidden" id="result-section">
      <div class="vs">
        <div class="vs-move" id="your-final-move"></div>
        <div class="vs-text">vs</div>
        <div class="vs-move" id="opponent-final-move"></div>
      </div>
      <div class="status" id="result-status"></div>
      <button id="rematch-btn" style="margin-top: 1rem;">Play Again</button>
    </div>

    <!-- Log -->
    <div class="section">
      <label>Event Log</label>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script type="module">
    import { generateSecretKey, getPublicKey, finalizeEvent, Relay } from 'https://esm.sh/nostr-tools@2.19.3';
    import * as secp256k1 from 'https://esm.sh/@noble/secp256k1@2.1.0';
    import { bech32m } from 'https://esm.sh/@scure/base@1.1.5';

    // Game state
    let secretKey;
    let pubkey;
    let relay;
    let gameId;
    let opponent;
    let myMove;
    let mySalt;
    let myCommit;
    let opponentCommit;
    let opponentMove;
    let isCreator = false;

    // Escrow state
    let escrowAgent = null;
    let useEscrow = false;
    let agentResolution = null;

    // Bitcoin state
    let btcPrivkey;
    let btcAddress;
    let faucetReceived = false;

    const MOVES = { rock: '🪨', paper: '📄', scissors: '✂️' };
    const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

    // Elements
    const $ = id => document.getElementById(id);
    const log = msg => {
      const el = $('log');
      const time = new Date().toLocaleTimeString();
      el.textContent = `[${time}] ${msg}\n` + el.textContent;
    };

    // Crypto helpers
    const sha256 = async (str) => {
      const buf = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const randomSalt = () => {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // Generate testnet4 Taproot address
    function generateBtcAddress() {
      btcPrivkey = new Uint8Array(32);
      crypto.getRandomValues(btcPrivkey);
      const fullPubkey = secp256k1.getPublicKey(btcPrivkey, true);
      const xOnlyPubkey = fullPubkey.slice(1); // Remove 02/03 prefix

      // Taproot address = bech32m encode of witness version 1 + x-only pubkey
      // For testnet4: hrp = 'tb'
      const words = bech32m.toWords(xOnlyPubkey);
      words.unshift(1); // Witness version 1 for Taproot
      btcAddress = bech32m.encode('tb', words);
      return btcAddress;
    }

    // Save keys to localStorage
    function saveKeys() {
      localStorage.setItem('rps-keys', JSON.stringify({
        secretKey: Array.from(secretKey),
        pubkey,
        btcPrivkey: Array.from(btcPrivkey),
        btcAddress,
        faucetReceived
      }));
    }

    // Fetch and display BTC balance
    async function updateBalance() {
      if (!btcAddress) return;
      try {
        const res = await fetch(`https://mempool.space/testnet4/api/address/${btcAddress}/utxo`);
        const utxos = await res.json();
        const balance = utxos.reduce((sum, u) => sum + u.value, 0);
        $('my-balance').textContent = `${balance.toLocaleString()} sats`;

        // Hide faucet if already have balance
        if (balance > 0) {
          faucetReceived = true;
          saveKeys();
          $('faucet-btn').textContent = 'Faucet Received';
          $('faucet-btn').disabled = true;
        }
      } catch (e) {
        $('my-balance').textContent = 'Error loading';
      }
    }

    // Initialize
    async function init() {
      // Load or generate Nostr keypair (persist in localStorage)
      const stored = localStorage.getItem('rps-keys');
      if (stored) {
        const keys = JSON.parse(stored);
        secretKey = new Uint8Array(keys.secretKey);
        pubkey = keys.pubkey;
        btcPrivkey = new Uint8Array(keys.btcPrivkey);
        btcAddress = keys.btcAddress;
        faucetReceived = keys.faucetReceived || false;
        log('Loaded existing keys');
      } else {
        secretKey = generateSecretKey();
        pubkey = getPublicKey(secretKey);
        generateBtcAddress();
        saveKeys();
        log('Generated new keys');
      }

      $('my-pubkey').textContent = pubkey.slice(0, 8) + '...' + pubkey.slice(-4);
      $('my-btc-address').textContent = btcAddress;

      // Fetch balance from chain
      updateBalance();

      // Update faucet button based on state
      if (faucetReceived) {
        $('faucet-btn').textContent = 'Faucet Received';
        $('faucet-btn').disabled = true;
      }

      // Setup move buttons
      document.querySelectorAll('.move-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          myMove = btn.dataset.move;
          $('commit-btn').disabled = false;
        });
      });

      // Check for game in URL
      const params = new URLSearchParams(window.location.search);
      const urlGame = params.get('game');
      if (urlGame) {
        $('join-input').value = urlGame;
        log(`Game ID from URL: ${urlGame}`);
      }

      // Escrow checkbox
      $('use-escrow').addEventListener('change', (e) => {
        useEscrow = e.target.checked;
        log(useEscrow ? 'Escrow enabled' : 'Escrow disabled');
      });

      // Faucet button
      $('faucet-btn').addEventListener('click', requestFaucet);
    }

    // Connect to relay
    async function connectRelay() {
      const url = $('relay-input').value;
      try {
        relay = await Relay.connect(url);
        log(`Connected to ${url}`);
        // Find escrow agents
        findEscrowAgents();
        return true;
      } catch (e) {
        log(`Failed to connect: ${e.message}`);
        return false;
      }
    }

    // Find available escrow agents
    function findEscrowAgents() {
      relay.subscribe([
        { kinds: [30336], '#t': ['rps-agent'], limit: 10 }
      ], {
        onevent(event) {
          try {
            const data = JSON.parse(event.content);
            if (data.type === 'agent_online') {
              const nameTag = event.tags.find(t => t[0] === 'name');
              const gamesTag = event.tags.find(t => t[0] === 'games');
              const volumeTag = event.tags.find(t => t[0] === 'volume');

              escrowAgent = {
                pubkey: event.pubkey,
                name: nameTag ? nameTag[1] : 'Unknown Agent',
                games: gamesTag ? parseInt(gamesTag[1]) : 0,
                volume: volumeTag ? parseInt(volumeTag[1]) : 0,
                fee: data.fee || 0
              };

              // Update UI
              $('no-agents').classList.add('hidden');
              $('agent-info').classList.remove('hidden');
              $('agent-name').textContent = escrowAgent.name;
              $('agent-games').textContent = `${escrowAgent.games} games`;
              $('agent-volume').textContent = `${escrowAgent.volume} sats`;
              $('agent-pubkey').textContent = escrowAgent.pubkey.slice(0, 12) + '...';

              // Enable faucet button
              if (!faucetReceived) {
                $('faucet-btn').disabled = false;
              }

              log(`Found agent: ${escrowAgent.name} (${escrowAgent.games} games)`);
            }
          } catch (e) {
            // Ignore parse errors
          }
        }
      });

      // Subscribe to agent responses for this player
      relay.subscribe([
        { kinds: [30337], '#p': [pubkey], limit: 5 }
      ], {
        onevent(event) {
          handleAgentResponse(event);
        }
      });
    }

    // Request faucet funds
    async function requestFaucet() {
      if (!relay || !escrowAgent) {
        log('Connect to relay first');
        return;
      }

      $('faucet-btn').disabled = true;
      $('faucet-status').textContent = 'Requesting...';
      log('Requesting faucet funds...');

      await publish({
        kind: 30334,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['t', 'rps-faucet']],
        content: JSON.stringify({
          type: 'faucet_request',
          btcAddress: btcAddress
        })
      });
    }

    // Handle agent responses (faucet, etc)
    function handleAgentResponse(event) {
      try {
        const data = JSON.parse(event.content);

        if (data.type === 'faucet_response') {
          if (data.success) {
            faucetReceived = true;
            saveKeys(); // Persist faucet received state
            $('faucet-status').textContent = `TX: ${data.txid.slice(0, 16)}...`;
            $('faucet-btn').textContent = 'Faucet Received';
            $('faucet-btn').disabled = true;
            log(`Faucet received! TX: ${data.txid}`);
            // Refresh balance after short delay (let mempool see it)
            setTimeout(updateBalance, 2000);
          } else {
            $('faucet-status').textContent = `Denied: ${data.reason}`;
            $('faucet-btn').disabled = false;
            log(`Faucet denied: ${data.reason}`);
          }
        }
      } catch (e) {
        // Ignore
      }
    }

    // Publish event
    async function publish(event) {
      const signed = finalizeEvent(event, secretKey);
      await relay.publish(signed);
      return signed;
    }

    // Subscribe to game events
    function subscribe(gameId) {
      relay.subscribe([
        { kinds: [30334], '#d': [gameId] },  // Game state
        { kinds: [30335], '#g': [gameId] },  // Moves
        { kinds: [30337], '#g': [gameId] }   // Agent responses
      ], {
        onevent(event) {
          handleEvent(event);
        }
      });
    }

    // Handle incoming events
    async function handleEvent(event) {
      try {
        const data = JSON.parse(event.content);

        if (event.kind === 30334) {
          // Game state update
          if (data.type === 'join' && event.pubkey !== pubkey) {
            opponent = event.pubkey;
            log(`Opponent joined: ${opponent.slice(0, 8)}...`);
            showSection('move-section');
          }
        }

        if (event.kind === 30335) {
          if (data.type === 'commit' && event.pubkey !== pubkey) {
            opponentCommit = data.hash;
            log(`Opponent committed: ${opponentCommit.slice(0, 8)}...`);
            checkBothCommitted();
          }

          if (data.type === 'reveal' && event.pubkey !== pubkey) {
            opponentMove = data.move;
            const expectedHash = await sha256(data.move + ':' + data.salt);
            if (expectedHash === opponentCommit) {
              log(`Opponent revealed: ${data.move}`);
              checkBothRevealed();
            } else {
              log('Opponent reveal hash mismatch! Cheating detected.');
            }
          }
        }

        // Agent responses (kind 30337)
        if (event.kind === 30337) {
          if (data.type === 'escrow_accepted') {
            log(`Escrow accepted by agent ${event.pubkey.slice(0, 8)}...`);
          }

          if (data.type === 'game_resolved') {
            agentResolution = data;
            log(`Agent resolved: ${data.winner === 'draw' ? 'DRAW' : data.winner.slice(0, 8) + '... wins'}`);
          }
        }
      } catch (e) {
        // Ignore parse errors
      }
    }

    // UI helpers
    function showSection(id) {
      ['lobby-section', 'waiting-section', 'move-section', 'commit-section', 'reveal-section', 'result-section']
        .forEach(s => $(s).classList.add('hidden'));
      $(id).classList.remove('hidden');
    }

    // Create game
    $('create-btn').addEventListener('click', async () => {
      if (!await connectRelay()) return;

      gameId = 'rps:' + randomSalt().slice(0, 12);
      isCreator = true;

      const createData = { type: 'create', creator: pubkey };
      if (useEscrow && escrowAgent) {
        createData.escrow = escrowAgent.pubkey;
        createData.stake = 1000; // Demo stake in sats
      }

      await publish({
        kind: 30334,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['d', gameId], ['t', 'rps']],
        content: JSON.stringify(createData)
      });

      // Send escrow request if enabled
      if (useEscrow && escrowAgent) {
        await publish({
          kind: 30334,
          created_at: Math.floor(Date.now() / 1000),
          tags: [['d', gameId], ['t', 'rps-escrow']],
          content: JSON.stringify({
            type: 'escrow_request',
            players: [pubkey],
            stake: 1000,
            agent: escrowAgent.pubkey
          })
        });
        log(`Escrow requested from ${escrowAgent.name}`);
      }

      subscribe(gameId);

      // Update URL and show shareable link
      const shareUrl = `${window.location.origin}${window.location.pathname}?game=${gameId}`;
      window.history.replaceState({}, '', `?game=${gameId}`);
      $('game-link-display').textContent = shareUrl;

      showSection('waiting-section');
      log(`Created game: ${gameId}`);
    });

    // Copy link button
    $('copy-btn').addEventListener('click', () => {
      const link = $('game-link-display').textContent;
      navigator.clipboard.writeText(link).then(() => {
        $('copy-btn').textContent = 'Copied!';
        setTimeout(() => $('copy-btn').textContent = 'Copy Link', 2000);
      });
    });

    // Join game
    $('join-btn').addEventListener('click', async () => {
      gameId = $('join-input').value.trim();
      if (!gameId) return;

      if (!await connectRelay()) return;

      subscribe(gameId);

      // Wait a moment for subscription, then announce join
      setTimeout(async () => {
        await publish({
          kind: 30334,
          created_at: Math.floor(Date.now() / 1000),
          tags: [['d', gameId], ['t', 'rps']],
          content: JSON.stringify({ type: 'join', player: pubkey })
        });

        log(`Joined game: ${gameId}`);
        showSection('move-section');
      }, 500);
    });

    // Commit move
    $('commit-btn').addEventListener('click', async () => {
      if (!myMove) return;

      mySalt = randomSalt();
      myCommit = await sha256(myMove + ':' + mySalt);

      await publish({
        kind: 30335,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['g', gameId], ['t', 'rps-move']],
        content: JSON.stringify({ type: 'commit', hash: myCommit })
      });

      $('your-move-display').textContent = MOVES[myMove];
      showSection('commit-section');
      log(`Committed: ${myCommit.slice(0, 8)}...`);

      checkBothCommitted();
    });

    // Check if both players committed
    async function checkBothCommitted() {
      if (myCommit && opponentCommit) {
        showSection('reveal-section');
        log('Both committed! Revealing...');

        // Small delay then reveal
        setTimeout(async () => {
          await publish({
            kind: 30335,
            created_at: Math.floor(Date.now() / 1000),
            tags: [['g', gameId], ['t', 'rps-move']],
            content: JSON.stringify({ type: 'reveal', move: myMove, salt: mySalt })
          });
          log(`Revealed: ${myMove}`);
        }, 1000);
      }
    }

    // Check if both players revealed
    function checkBothRevealed() {
      if (myMove && opponentMove) {
        showResult();
      }
    }

    // Show result
    function showResult() {
      $('your-final-move').textContent = MOVES[myMove];
      $('opponent-final-move').textContent = MOVES[opponentMove];

      let result, statusClass;
      if (myMove === opponentMove) {
        result = "It's a draw!";
        statusClass = 'draw';
      } else if (BEATS[myMove] === opponentMove) {
        result = 'You win!';
        statusClass = 'win';
      } else {
        result = 'You lose!';
        statusClass = 'lose';
      }

      // Add escrow verification note
      if (useEscrow && agentResolution) {
        result += ' (Verified by escrow agent)';
      }

      const statusEl = $('result-status');
      statusEl.textContent = result;
      statusEl.className = 'status ' + statusClass;

      showSection('result-section');
      log(`Result: ${myMove} vs ${opponentMove} - ${result}`);
    }

    // Rematch
    $('rematch-btn').addEventListener('click', () => {
      myMove = null;
      mySalt = null;
      myCommit = null;
      opponentCommit = null;
      opponentMove = null;
      agentResolution = null;
      document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
      $('commit-btn').disabled = true;
      showSection('move-section');
      log('Starting rematch...');
    });

    // Start
    init();
  </script>
</body>
</html>
